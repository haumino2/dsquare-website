<html lang="en">
<head>

    :root {

    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:"Funnel Sans",sans-serif; color:var(--ink); background:var(--paper); }
    button { font:inherit; }
    .shell { min-height:100vh; display:grid; grid-template-rows:auto auto 1fr; }
    .topbar { display:flex; justify-content:space-between; gap:2rem; padding:1.1rem 1.5rem; background:var(--ink); color:white; }
    .top-actions { display:flex; align-items:center; gap:1rem; }
    .lang-switch { display:flex; border:1px solid #555; }
    .lang-switch button { border:0; padding:.35rem .55rem; background:transparent; color:#aaa; cursor:pointer; }
    .lang-switch button[aria-pressed="true"] { background:white; color:var(--ink); }
    .brand { font-family:"Funnel Display",sans-serif; font-weight:700; letter-spacing:.04em; }
    .topbar p { margin:0; color:#cfcfcf; font-size:.9rem; }
    .tabs { display:flex; gap:.35rem; padding:.75rem 1.5rem; border-bottom:1px solid var(--line); background:var(--white); overflow:auto; }
    .tab { border:0; background:transparent; padding:.65rem .9rem; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
    .tab[aria-selected="true"] { color:var(--ink); border-color:var(--ink); font-weight:600; }
    .workspace { min-height:0; display:grid; grid-template-columns:minmax(520px,1fr) 420px; }
    .preview-panel { min-width:0; padding:1.25rem; overflow:auto; }
    .preview-toolbar { display:flex; justify-content:space-between; gap:1rem; align-items:center; margin-bottom:.7rem; }
    .preview-toolbar strong { font-family:"Funnel Display",sans-serif; }
    .preview-toolbar span { color:var(--muted); font-size:.85rem; }
    .browser { position:relative; width:100%; height:calc(100vh - 160px); min-height:600px; background:white; border:1px solid var(--line); overflow:hidden; }
    .browser-head { height:36px; display:flex; align-items:center; gap:7px; padding:0 12px; background:#ececec; border-bottom:1px solid var(--line); }
    .browser-head i { width:8px; height:8px; border-radius:50%; background:#aaa; }
    .browser-head code { margin-left:8px; color:#777; font-size:.72rem; }
    iframe { width:100%; height:calc(100% - 36px); border:0; background:white; }
    .notes { min-height:0; background:var(--white); border-left:1px solid var(--line); overflow:auto; padding:1.25rem; }
    .notes-header { padding-bottom:1rem; border-bottom:1px solid var(--line); }
    .notes-header h1 { margin:0 0 .4rem; font-family:"Funnel Display",sans-serif; font-size:1.45rem; }
    .notes-header p { margin:0; color:var(--muted); font-size:.92rem; line-height:1.45; }
    .assessment { display:grid; grid-template-columns:1fr 1fr; gap:.45rem .8rem; margin-top:.85rem; }
    .assessment div { padding-top:.45rem; border-top:1px solid var(--line); }
    .assessment b { display:block; font-size:.76rem; text-transform:uppercase; letter-spacing:.035em; }
    .assessment span { display:block; margin-top:.12rem; color:var(--muted); font-size:.75rem; line-height:1.3; }
    .guardrail { margin-top:.85rem !important; color:var(--ink) !important; font-size:.82rem !important; }
    .legend { display:flex; flex-wrap:wrap; gap:.55rem 1rem; margin-top:.85rem; font-size:.78rem; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:.4rem; }
    .dot { width:8px; height:8px; border-radius:50%; }
    .note-list { display:grid; gap:.75rem; padding:1rem 0; }
    .focus-section { padding:1rem 0; border-bottom:1px solid var(--line); }
    .focus-section > h2 { margin:0 0 .25rem; font-family:"Funnel Display",sans-serif; font-size:1.05rem; }
    .focus-section > p { margin:0 0 .65rem; color:var(--muted); font-size:.8rem; }
    .focus-list { display:grid; gap:.15rem; }
    .focus-item { width:100%; border:0; background:transparent; text-align:left; cursor:pointer; padding:.48rem .2rem .48rem 1rem; position:relative; }
    .focus-item::before { content:""; position:absolute; left:0; top:.82rem; width:7px; height:7px; border-radius:50%; }
    .focus-section.keep .focus-item::before { background:var(--keep); }
    .focus-section.design .focus-item::before { background:var(--design); }
    .focus-item b { display:block; font-size:.88rem; }
    .focus-item span { display:block; color:var(--muted); font-size:.82rem; line-height:1.35; margin-top:.12rem; }
    .secondary { padding:.85rem 0; }
    .secondary summary { cursor:pointer; font-weight:600; font-size:.86rem; color:var(--muted); }
    .secondary .note-list { padding:.5rem 0 0; }
    .creative-freedom { margin-top:.85rem; padding:.75rem .85rem; background:#f2eee8; }
    .creative-freedom b { display:block; font-size:.82rem; }
    .creative-freedom p { margin:.25rem 0 0; color:var(--muted); font-size:.8rem; line-height:1.4; }
    .note { width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--line); padding:.9rem .1rem .2rem 1.2rem; position:relative; cursor:pointer; }
    .note:first-child { border-top:0; }
    .note::before { content:""; position:absolute; left:0; top:1.25rem; width:8px; height:8px; border-radius:50%; background:var(--line); }
    .note[data-kind="keep"]::before { background:var(--keep); }
    .note[data-kind="design"]::before { background:var(--design); }
    .note[data-kind="build"]::before { background:var(--build); }
    .note[data-kind="decision"]::before { background:var(--decision); }
    .note:hover h2,.note:focus h2 { text-decoration:underline; text-underline-offset:3px; }
    .note h2 { margin:0 0 .35rem; font-family:"Funnel Display",sans-serif; font-size:1rem; }
    .note p { margin:0; color:var(--muted); line-height:1.4; font-size:.88rem; }
    .note small { display:block; margin-top:.55rem; color:var(--ink); font-weight:600; letter-spacing:.02em; }
    @media(max-width:980px){
      .workspace { grid-template-columns:1fr; }
      .notes { border-left:0; border-top:1px solid var(--line); }
      .browser { height:70vh; }
    }
  </style>
</head>

        vi:{goal:'Goal: giúp người xem và AI hiểu ngay DSQUARE là ai, làm gì và có evidence năng lực nào.',profile:[['Entity','DSQUARE — Growth Partner Agency tại Việt Nam.'],['Direct answer','DSQUARE giúp brand tăng trưởng bằng 4 năng lực kết nối.'],['Evidence','Featured work và verified results từ các case nổi bật.'],['Context','Vietnam market; brand, CX/CRM, commerce và digital solutions.'],['Relationship','Dẫn đến Services, Case Studies, Insights và Contact.']],freedom:'Design được tự do xử lý art direction, hero composition, typography, image treatment, navigation và motion. Chỉ cần giữ một entity statement dễ thấy và đường dẫn rõ đến capability/proof.'},
        en:{goal:'Goal: help people and AI understand who DSQUARE is, what it does and what proves its capability.',profile:[['Entity','DSQUARE — a Growth Partner Agency in Vietnam.'],['Direct answer','DSQUARE drives growth through four connected capabilities.'],['Evidence','Featured work and verified results from priority cases.'],['Context','Vietnam; brand, CX/CRM, commerce and digital solutions.'],['Relationship','Connect to Services, Case Studies, Insights and Contact.']],freedom:'Design is free to shape the art direction, hero, typography, imagery, navigation and motion. Keep one visible entity statement and clear paths to capability and proof.'}
      },
      services:{
        vi:{goal:'Goal: giúp người xem hiểu DSQUARE giải quyết vấn đề gì và nên chọn capability nào.',profile:[['Entity','4 service pillars thuộc DSQUARE.'],['Direct answer','Mỗi service giải quyết problem nào và tạo output gì.'],['Evidence','Case study, result hoặc insight chứng minh từng capability.'],['Context','Business/marketing challenge và phạm vi delivery của service.'],['Relationship','Mỗi service nối trực tiếp với Work và Insights liên quan.']],freedom:'Design được tự do chọn growth loop, journey, operating system hoặc interaction model; tự do thay layout/card system. Chỉ cần giữ definition, problem solved và proof ở dạng text có thể đọc được.'},
        en:{goal:'Goal: help people understand which problems DSQUARE solves and which capability fits.',profile:[['Entity','DSQUARE’s four service pillars.'],['Direct answer','What problem each service solves and what it delivers.'],['Evidence','Cases, results or insights supporting each capability.'],['Context','The business challenge and delivery scope.'],['Relationship','Each service connects directly to relevant Work and Insights.']],freedom:'Design may choose a loop, journey, operating system or other interaction model and freely reshape the layout. Keep definitions, problems solved and proof readable as text.'}
      },
      work:{
        vi:{goal:'Goal: chứng minh DSQUARE đã tạo ra thay đổi gì cho một client cụ thể.',profile:[['Entity','DSQUARE + client + project/campaign.'],['Direct answer','Challenge gì, DSQUARE làm gì và outcome là gì.'],['Evidence','Verified metric/qualitative proof với label, timeframe và source.'],['Context','Market, thời điểm, service và scope cụ thể của DSQUARE.'],['Relationship','Case nối về capability và Insight liên quan.']],freedom:'Design được tự do tạo art direction riêng cho từng project, cinematic media, scroll storytelling, motion và composition. Chỉ cần Challenge, Approach, Impact, DSQUARE Role và verified result vẫn dễ tìm.'},
        en:{goal:'Goal: prove what DSQUARE changed for a specific client.',profile:[['Entity','DSQUARE + client + project or campaign.'],['Direct answer','The challenge, DSQUARE approach and resulting outcome.'],['Evidence','Verified metrics or qualitative proof with label, timeframe and source.'],['Context','Market, timing, service and DSQUARE’s specific scope.'],['Relationship','Connect the case to its capability and related Insight.']],freedom:'Design may create a distinct art direction, cinematic media, scroll narrative, motion and composition for each project. Keep Challenge, Approach, Impact, DSQUARE Role and verified results easy to find.'}
      },
      insight:{
        vi:{goal:'Goal: thể hiện expertise của DSQUARE bằng một point of view có thể trích dẫn và kiểm chứng.',profile:[['Entity','Chủ đề chuyên môn + author/practice của DSQUARE.'],['Direct answer','Luận điểm chính được trả lời ngay sau H1.'],['Evidence','Case example, verified metric, source hoặc practical framework.'],['Context','Vì sao chủ đề quan trọng, áp dụng khi nào và cho ai.'],['Relationship','Article nối với related Service và Work.']],freedom:'Design được tự do xây editorial identity, typography, cover art, illustration, data visualization và reading interaction. Chỉ cần direct answer, author/date, source và related links không bị ẩn.'},
        en:{goal:'Goal: express DSQUARE expertise through a quotable and verifiable point of view.',profile:[['Entity','The expertise topic + DSQUARE author or practice.'],['Direct answer','The main thesis appears immediately after the H1.'],['Evidence','Case example, verified metric, source or practical framework.'],['Context','Why the topic matters, when it applies and to whom.'],['Relationship','Connect the article to related Services and Work.']],freedom:'Design may create the editorial identity, typography, cover art, illustration, data visualization and reading interactions. Keep the direct answer, author/date, sources and related links visible.'}
      }
    };
    const tabs=document.getElementById('tabs'), notes=document.getElementById('notes'), frame=document.getElementById('preview');
    let current=pages[0], lang='vi';

    function renderTabs(){
      tabs.innerHTML=pages.map(p=>`<button class="tab" type="button" data-page="${p.id}" aria-selected="${p.id===current.id}">${p.label}</button>`).join('');
      tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectPage(b.dataset.page)));
    }
    function renderNotes(){
      const c=ui[lang], f=focus[current.id][lang], brief=pageBrief[current.id][lang];
      const group=(kind,items)=>`<section class="focus-section ${kind}"><h2>${kind==='keep'?c.keep:c.design}</h2><p>${kind==='keep'?c.keepHint:c.designHint}</p><div class="focus-list">${items.map((x,i)=>`<button class="focus-item" type="button" data-group="${kind}" data-index="${i}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div></section>`;
      const secondary=current.notes.filter(n=>n.kind==='build'||n.kind==='decision');
      notes.innerHTML=group('keep',f.keep)+group('design',f.design)+`<div class="creative-freedom"><b>CREATIVE FREEDOM</b><p>${brief.freedom}</p></div><details class="secondary"><summary>${c.secondary}</summary><div class="note-list">${secondary.map((n,i)=>{const v=vi[n.title];const title=lang==='vi'?v[0]:n.title;const body=lang==='vi'?v[1]:n.body;return `<button class="note" type="button" data-secondary="${i}" data-kind="${n.kind}"><h2>${title}</h2><p>${body}</p></button>`}).join('')}</div></details>`;
      notes.querySelectorAll('.focus-item').forEach(b=>b.addEventListener('click',()=>{const x=f[b.dataset.group][Number(b.dataset.index)];focusArea({kind:b.dataset.group,selector:x[2]})}));
      notes.querySelectorAll('[data-secondary]').forEach(b=>b.addEventListener('click',()=>focusArea(secondary[Number(b.dataset.secondary)])));
    }
    function selectPage(id){
      current=pages.find(p=>p.id===id); renderTabs(); renderNotes();
      document.getElementById('page-title').textContent=current.title;
      document.getElementById('url-label').textContent=current.url;
      frame.src=current.url; renderLanguage();
    }
    function focusArea(note){
      const doc=frame.contentDocument; if(!doc) return;
      doc.querySelectorAll('[data-opportunity-focus]').forEach(el=>{el.style.outline='';el.style.outlineOffset='';el.removeAttribute('data-opportunity-focus');});
      let target=doc.querySelector(note.selector) || doc.querySelector('main'); if(!target) return;
      const colors={keep:'#2f7750',design:'#d56a24',build:'#2873c8',decision:'#7350a7'};
      target.setAttribute('data-opportunity-focus',''); target.style.outline=`5px solid ${colors[note.kind]}`; target.style.outlineOffset='-5px';
      target.scrollIntoView({behavior:'smooth',block:'center'});
    }
    function renderLanguage(){
      const c=ui[lang], brief=pageBrief[current.id][lang]; document.getElementById('top-instruction').textContent=c.instruction; document.getElementById('notes-title').textContent=c.title; document.getElementById('notes-intro').textContent=brief.goal;
      document.getElementById('assessment').innerHTML=brief.profile.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join(''); document.getElementById('design-guardrail').textContent=c.guardrail;
      document.querySelectorAll('[data-legend]').forEach(el=>el.textContent=c.legend[el.dataset.legend]);
      document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang))); renderNotes();
    }
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;renderLanguage()}));
    selectPage('home'); renderLanguage();
  </script>
</body>
