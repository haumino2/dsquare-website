<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DSQUARE Website — Visual Ownership Opportunity Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Funnel+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#171717; --muted:#696969; --line:#d8d8d8; --paper:#f5f4ef;
      --white:#fff; --keep:#2f7750; --design:#d56a24; --build:#2873c8; --decision:#7350a7;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:"Funnel Sans",sans-serif; color:var(--ink); background:var(--paper); }
    button { font:inherit; }
    .shell { min-height:100vh; display:grid; grid-template-rows:auto auto 1fr; }
    .topbar { display:flex; justify-content:space-between; gap:2rem; padding:1.1rem 1.5rem; background:var(--ink); color:white; }
    .top-actions { display:flex; align-items:center; gap:1rem; }
    .lang-switch { display:flex; border:1px solid #555; }
    .lang-switch button { border:0; padding:.35rem .55rem; background:transparent; color:#aaa; cursor:pointer; }
    .lang-switch button[aria-pressed="true"] { background:white; color:var(--ink); }
    .brand { font-family:"Funnel Display",sans-serif; font-weight:700; letter-spacing:.04em; }
    .topbar p { margin:0; color:#cfcfcf; font-size:.9rem; }
    .tabs { display:flex; gap:.35rem; padding:.75rem 1.5rem; border-bottom:1px solid var(--line); background:var(--white); overflow:auto; }
    .tab { border:0; background:transparent; padding:.65rem .9rem; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
    .tab[aria-selected="true"] { color:var(--ink); border-color:var(--ink); font-weight:600; }
    .workspace { min-height:0; display:grid; grid-template-columns:minmax(520px,1fr) 420px; }
    .preview-panel { min-width:0; padding:1.25rem; overflow:auto; }
    .preview-toolbar { display:flex; justify-content:space-between; gap:1rem; align-items:center; margin-bottom:.7rem; }
    .preview-toolbar strong { font-family:"Funnel Display",sans-serif; }
    .preview-toolbar span { color:var(--muted); font-size:.85rem; }
    .browser { position:relative; width:100%; height:calc(100vh - 160px); min-height:600px; background:white; border:1px solid var(--line); overflow:hidden; }
    .browser-head { height:36px; display:flex; align-items:center; gap:7px; padding:0 12px; background:#ececec; border-bottom:1px solid var(--line); }
    .browser-head i { width:8px; height:8px; border-radius:50%; background:#aaa; }
    .browser-head code { margin-left:8px; color:#777; font-size:.72rem; }
    iframe { width:100%; height:calc(100% - 36px); border:0; background:white; }
    .notes { min-height:0; background:var(--white); border-left:1px solid var(--line); overflow:auto; padding:1.25rem; }
    .notes-header { padding-bottom:1rem; border-bottom:1px solid var(--line); }
    .notes-header h1 { margin:0 0 .4rem; font-family:"Funnel Display",sans-serif; font-size:1.45rem; }
    .notes-header p { margin:0; color:var(--muted); font-size:.92rem; line-height:1.45; }
    .legend { display:flex; flex-wrap:wrap; gap:.55rem 1rem; margin-top:.85rem; font-size:.78rem; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:.4rem; }
    .dot { width:8px; height:8px; border-radius:50%; }
    .note-list { display:grid; gap:.75rem; padding:1rem 0; }
    .focus-section { padding:1rem 0; border-bottom:1px solid var(--line); }
    .focus-section > h2 { margin:0 0 .25rem; font-family:"Funnel Display",sans-serif; font-size:1.05rem; }
    .focus-section > p { margin:0 0 .65rem; color:var(--muted); font-size:.8rem; }
    .focus-list { display:grid; gap:.15rem; }
    .focus-item { width:100%; border:0; background:transparent; text-align:left; cursor:pointer; padding:.48rem .2rem .48rem 1rem; position:relative; }
    .focus-item::before { content:""; position:absolute; left:0; top:.82rem; width:7px; height:7px; border-radius:50%; }
    .focus-section.keep .focus-item::before { background:var(--keep); }
    .focus-section.design .focus-item::before { background:var(--design); }
    .focus-item b { display:block; font-size:.88rem; }
    .focus-item span { display:block; color:var(--muted); font-size:.82rem; line-height:1.35; margin-top:.12rem; }
    .secondary { padding:.85rem 0; }
    .secondary summary { cursor:pointer; font-weight:600; font-size:.86rem; color:var(--muted); }
    .secondary .note-list { padding:.5rem 0 0; }
    .note { width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--line); padding:.9rem .1rem .2rem 1.2rem; position:relative; cursor:pointer; }
    .note:first-child { border-top:0; }
    .note::before { content:""; position:absolute; left:0; top:1.25rem; width:8px; height:8px; border-radius:50%; background:var(--line); }
    .note[data-kind="keep"]::before { background:var(--keep); }
    .note[data-kind="design"]::before { background:var(--design); }
    .note[data-kind="build"]::before { background:var(--build); }
    .note[data-kind="decision"]::before { background:var(--decision); }
    .note:hover h2,.note:focus h2 { text-decoration:underline; text-underline-offset:3px; }
    .note h2 { margin:0 0 .35rem; font-family:"Funnel Display",sans-serif; font-size:1rem; }
    .note p { margin:0; color:var(--muted); line-height:1.4; font-size:.88rem; }
    .note small { display:block; margin-top:.55rem; color:var(--ink); font-weight:600; letter-spacing:.02em; }
    @media(max-width:980px){
      .workspace { grid-template-columns:1fr; }
      .notes { border-left:0; border-top:1px solid var(--line); }
      .browser { height:70vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">DSQUARE · VISUAL OWNERSHIP MAP</div>
      <div class="top-actions"><p id="top-instruction"></p><div class="lang-switch" aria-label="Language"><button type="button" data-lang="vi" aria-pressed="true">VI</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
    </header>
    <nav class="tabs" aria-label="Page archetypes" id="tabs"></nav>
    <main class="workspace">
      <section class="preview-panel" aria-label="Current prototype preview">
        <div class="preview-toolbar"><strong id="page-title"></strong><span>Current Cursor prototype · not final visual direction</span></div>
        <div class="browser">
          <div class="browser-head"><i></i><i></i><i></i><code id="url-label"></code></div>
          <iframe id="preview" title="DSQUARE prototype preview"></iframe>
        </div>
      </section>
      <aside class="notes">
        <div class="notes-header">
          <h1 id="notes-title"></h1>
          <p id="notes-intro"></p>
          <div class="legend">
            <span><i class="dot" style="background:var(--keep)"></i><b data-legend="keep"></b></span>
            <span><i class="dot" style="background:var(--design)"></i><b data-legend="design"></b></span>
            <span><i class="dot" style="background:var(--build)"></i><b data-legend="build"></b></span>
            <span><i class="dot" style="background:var(--decision)"></i><b data-legend="decision"></b></span>
          </div>
        </div>
        <div class="note-list" id="notes"></div>
      </aside>
    </main>
  </div>
  <script>
    const pages = [
      {

          {kind:'keep',selector:'.hero-panel',title:'Keep the explicit entity answer',body:'DSQUARE must remain clearly defined as a Growth Partner Agency in Vietnam with four connected capabilities.',owner:'STRATEGY + AEO'},
          {kind:'design',selector:'.hero',title:'Make DSQUARE the protagonist',body:'The featured Suzuki campaign creates energy, but the brand needs a stronger visual frame so the page is not remembered as a client landing page.',owner:'DESIGN · HERO TERRITORIES'},
          {kind:'design',selector:'.section',title:'Create an ownable homepage rhythm',body:'Rework typography, composition, transitions and image behavior so the experience demonstrates DSQUARE capability—not only organizes content.',owner:'DESIGN · ART DIRECTION'},
          {kind:'build',selector:'.hero-media',title:'Validate image crop and layering against Figma',body:'Before redesigning the hero, identify which weaknesses come from the Cursor translation rather than the WIP design.',owner:'DEVELOPMENT · FIDELITY'},
          {kind:'decision',selector:'.hero-panel',title:'Choose the leading brand character',body:'Credible vs provocative, systematic vs expressive, premium vs energetic—the selected tension should guide every page.',owner:'CEO + DESIGN'}
        ]
      },
      {
        id:'services', label:'Services', title:'Services · system, not a catalogue', url:'services.html',

          {kind:'keep',selector:'.pillar',title:'Keep the four service pillars and their answer structure',body:'Service names, problems solved, capabilities, related work and insights must stay visible and indexable.',owner:'STRATEGY + AEO'},
          {kind:'design',selector:'.pillar-grid',title:'Visualize how the capabilities compound',body:'Explore a loop, journey or operating system that makes the four pillars feel connected rather than four separate offerings.',owner:'DESIGN · SERVICE MODEL'},
          {kind:'design',selector:'.detail-list',title:'Replace repeated-card rhythm with stronger hierarchy',body:'Use scale, sequence and interaction to distinguish proposition, capabilities, proof and pathways to related work.',owner:'DESIGN · UI SYSTEM'},
          {kind:'build',selector:'.related-links',title:'Preserve semantic links in visual treatments',body:'Any diagram or interactive layer should enhance—not replace—the HTML text and internal linking.',owner:'DEVELOPMENT + AEO'},
          {kind:'decision',selector:'.page-hero',title:'Select the primary mental model',body:'Is DSQUARE best understood as a partner, an integrated operating system, or a journey from brand to revenue?',owner:'CEO + STRATEGY + DESIGN'}
        ]
      },
      {
        id:'work', label:'Case Study', title:'Case Study · proof through storytelling', url:'work-ariston.html',
        notes:[
          {kind:'keep',selector:'.story-grid',title:'Keep Challenge → Approach → Impact',body:'The evidence structure and distinction between published results and unavailable KPIs are trust signals.',owner:'CONTENT + AEO'},
          {kind:'design',selector:'.case-hero',title:'Give each project a specific visual rhythm',body:'Use project assets, sequencing and art direction more expressively while preserving a recognizable DSQUARE system.',owner:'DESIGN · CASE-STUDY SYSTEM'},
          {kind:'design',selector:'.impact-grid',title:'Turn proof into a visual language',body:'Create distinct treatments for hard metrics, sourced claims, qualitative outcomes and confidential performance.',owner:'DESIGN · PROOF COMPONENTS'},
          {kind:'build',selector:'.media-frame',title:'Design for uneven asset availability',body:'The production layout must remain strong for both asset-rich campaigns and cases with only a few approved visuals.',owner:'DESIGN + DEVELOPMENT'},
          {kind:'decision',selector:'.story-grid',title:'Confirm which claims can be publicly evidenced',body:'Every prominent proof point needs a source, approval status and clear attribution.',owner:'ACCOUNT + LEADERSHIP'}
        ]
      },
      {
        id:'insight', label:'Insight', title:'Insight · thinking from the work', url:'insight-brand-quality-proof.html',
        notes:[
          {kind:'keep',selector:'.article-body',title:'Keep answer-first editorial structure',body:'Clear question, direct answer, supporting sections, dates, author and related work strengthen AEO and credibility.',owner:'CONTENT + AEO'},
          {kind:'design',selector:'.page-hero',title:'Avoid a generic corporate-blog experience',body:'Build an editorial identity through covers, taxonomy, pull answers, visual evidence and connections to project work.',owner:'DESIGN · EDITORIAL SYSTEM'},
          {kind:'design',selector:'.article-body',title:'Design for scanning without flattening the thinking',body:'Use hierarchy, callouts and visual anchors so key answers are easy to extract while long-form reasoning remains readable.',owner:'DESIGN · TYPOGRAPHY'},
          {kind:'build',selector:'.author-card',title:'Keep authority data machine-readable',body:'The visual byline should map cleanly to author, publisher, datePublished and dateModified metadata.',owner:'DEVELOPMENT + AEO'},
          {kind:'decision',selector:'.author-card',title:'Confirm the authority model',body:'Choose named practitioners, practice-level bylines, or both. This affects both interface and Article schema.',owner:'LEADERSHIP + CONTENT'}
        ]
      }
    ];

    const vi = {
      'Keep the explicit entity answer':['Giữ câu định vị rõ ràng','DSQUARE là Growth Partner Agency tại Việt Nam, với 4 năng lực kết nối.','STRATEGY + AEO'],
      'Make DSQUARE the protagonist':['Đưa DSQUARE thành nhân vật chính','Featured work là bằng chứng; DSQUARE phải là điều người xem ghi nhớ.','DESIGN · HERO'],
      'Create an ownable homepage rhythm':['Tạo nhịp thị giác riêng của DSQUARE','Tái thiết typography, composition, motion và image treatment.','DESIGN · ART DIRECTION'],
      'Validate image crop and layering against Figma':['Kiểm tra fidelity với Figma','Xác định lỗi do clone trước khi yêu cầu redesign.','DEVELOPMENT'],
      'Choose the leading brand character':['Chốt tính cách thị giác chủ đạo','Chọn một tension dẫn dắt: credible/provocative, systematic/expressive hoặc premium/energetic.','CEO + DESIGN'],
      'Keep the four service pillars and their answer structure':['Giữ 4 service pillars','Giữ tên, vấn đề, năng lực, related work và insights ở dạng text.','STRATEGY + AEO'],
      'Visualize how the capabilities compound':['Thể hiện 4 năng lực như một hệ thống','Dùng growth loop, journey hoặc operating system thay vì 4 nhóm rời.','DESIGN · SERVICE MODEL'],
      'Replace repeated-card rhythm with stronger hierarchy':['Giảm cảm giác card lặp lại','Tạo hierarchy rõ giữa proposition, capability và proof.','DESIGN · UI'],
      'Preserve semantic links in visual treatments':['Giữ text và internal links','Visualization bổ trợ, không thay thế nội dung HTML.','DEVELOPMENT + AEO'],
      'Select the primary mental model':['Chọn mental model chính','Partner, integrated system hay hành trình từ brand đến revenue?','CEO + STRATEGY + DESIGN'],
      'Preserve the evidence structure':['Giữ cấu trúc bằng chứng','Challenge → Approach → Impact; phân biệt KPI công khai và confidential.','CONTENT + AEO'],
      'Give each project a specific visual rhythm':['Tạo nhịp riêng cho từng case','Cho phép art direction theo project trong một hệ DSQUARE nhất quán.','DESIGN · CASE STUDY'],
      'Turn proof into a visual language':['Biến proof thành visual language','Thiết kế state riêng cho metric, claim có nguồn và qualitative outcome.','DESIGN · PROOF'],
      'Design for uneven asset availability':['Thiết kế cho asset không đồng đều','Layout vẫn mạnh khi project chỉ có ít hình ảnh được duyệt.','DESIGN + DEVELOPMENT'],
      'Confirm which claims can be publicly evidenced':['Xác nhận claim được phép công khai','Mỗi proof point cần source, approval và attribution.','ACCOUNT + LEADERSHIP'],
      'Keep answer-first editorial structure':['Giữ cấu trúc answer-first','Câu hỏi, câu trả lời, author, date và related work phải rõ.','CONTENT + AEO'],
      'Avoid a generic corporate-blog experience':['Tránh giao diện corporate blog','Tạo editorial identity bằng cover, taxonomy và project proof.','DESIGN · EDITORIAL'],
      'Design for scanning without flattening the thinking':['Tối ưu khả năng scan','Dùng hierarchy và callout để làm nổi bật key answers.','DESIGN · TYPOGRAPHY'],
      'Keep authority data machine-readable':['Giữ authority data đọc được bởi máy','Byline phải map được với author, publisher và publication dates.','DEVELOPMENT + AEO'],
      'Confirm the authority model':['Chốt mô hình tác giả','Dùng tên chuyên gia, practice byline hay kết hợp cả hai?','LEADERSHIP + CONTENT']
    };
    const ui={
      vi:{instruction:'Chọn một ý để đến đúng khu vực trên prototype.',title:'AEO × Visual focus',intro:'Giữ rõ direct answer và evidence cốt lõi. Design giúp người xem nhận ra nhanh, hiểu đúng và ghi nhớ lâu hơn.',legend:{keep:'KEEP for AEO',design:'Design ownership',build:'Implementation gap',decision:'Cần quyết định'},keep:'KEEP for AEO',keepHint:'Nội dung và quan hệ không được làm mất.',design:'DESIGN OWNERSHIP',designHint:'Cách làm direct answer và evidence nổi bật hơn.',secondary:'Decision & implementation gaps',sprint:'Design sprint đầu tiên',steps:['Đối chiếu notes với Figma WIP.','Tạo 2–3 visual territories cho Homepage.','Áp dụng direction được chọn vào một Case Study.','Stress-test Services và mobile trước khi scale.']},
      en:{instruction:'Select an item to jump to the relevant area.',title:'AEO × Visual focus',intro:'Keep the answers and evidence. Design makes them visible, clear and memorable.',legend:{keep:'KEEP for AEO',design:'Design ownership',build:'Implementation gap',decision:'Decision needed'},keep:'KEEP for AEO',keepHint:'Content and relationships that must remain.',design:'DESIGN OWNERSHIP',designHint:'Make the direct answer and evidence more prominent.',secondary:'Decision & implementation gaps',sprint:'Suggested first design sprint',steps:['Validate notes against Figma WIP.','Create 2–3 Homepage visual territories.','Apply the preferred direction to one Case Study.','Stress-test Services and mobile before scaling.']}
    };
    const focus={
      home:{
        vi:{keep:[['Structure','Entity answer ở hero → 4 capabilities → Work/Services/Contact.','.hero'],['Direct answer','DSQUARE là Growth Partner Agency tại Việt Nam.','.hero-panel'],['Evidence','Featured work và verified results chứng minh capability.','.section'],['Context','Vietnam market; creativity, CX, commerce, data và technology.','.hero-panel'],['Relationship','Capability link đến Services; proof link đến Case Study.','.btn-row']],design:[['Hero hierarchy','Bold DSQUARE positioning trước; campaign là visual proof.','.hero'],['Capability visualization','Biến 4 capabilities thành một connected growth system.','.hero-panel'],['Evidence treatment','Highlight 2–4 verified proof points với label và context.','.section']]},
        en:{keep:[['Structure','Entity answer → four capabilities → Work/Services/Contact.','.hero'],['Direct answer','DSQUARE is a Growth Partner Agency in Vietnam.','.hero-panel'],['Evidence','Featured work and verified results prove capability.','.section'],['Context','Vietnam; creativity, CX, commerce, data and technology.','.hero-panel'],['Relationship','Capabilities link to Services; proof links to Case Studies.','.btn-row']],design:[['Hero hierarchy','Lead with DSQUARE positioning; use the campaign as proof.','.hero'],['Capability visualization','Show four capabilities as one connected growth system.','.hero-panel'],['Evidence treatment','Highlight 2–4 verified proof points with labels and context.','.section']]}
      },
      services:{
        vi:{keep:[['Structure','Mỗi service: definition → problem → capability → proof.','.pillar'],['Direct answer','DSQUARE cung cấp 4 nhóm dịch vụ tăng trưởng kết nối.','.page-hero'],['Evidence','Mỗi pillar link ít nhất 1 case và 1 insight liên quan.','.related-links'],['Context','Nêu rõ vấn đề business/marketing mà service giải quyết.','.detail-list'],['Relationship','Service ↔ Work ↔ Insights bằng anchor text cụ thể.','.related-links']],design:[['Service model','Visualize 4 pillars như loop, journey hoặc operating system.','.pillar-grid'],['Answer hierarchy','Bold proposition và problems solved trước capability list.','.detail-list'],['Proof integration','Đưa case/result vào flow, không để như related links phụ.','.related-links']]},
        en:{keep:[['Structure','Each service: definition → problem → capability → proof.','.pillar'],['Direct answer','DSQUARE provides four connected growth capabilities.','.page-hero'],['Evidence','Each pillar links to at least one case and one insight.','.related-links'],['Context','State the business or marketing problem being solved.','.detail-list'],['Relationship','Connect Service ↔ Work ↔ Insights with descriptive links.','.related-links']],design:[['Service model','Visualize the pillars as a loop, journey or operating system.','.pillar-grid'],['Answer hierarchy','Lead with proposition and problems solved.','.detail-list'],['Proof integration','Bring cases and results into the main flow.','.related-links']]}
      },
      work:{
        vi:{keep:[['Structure','Challenge → Approach → Impact → DSQUARE role.','.story-grid'],['Direct answer','DSQUARE đã giải quyết vấn đề gì, bằng cách nào, với kết quả gì.','.story-grid'],['Evidence','Metric có value, unit, timeframe và source/approval.','.impact-grid'],['Context','Client, market, project, service và scope của DSQUARE.','.case-hero'],['Relationship','Case link về Service và Insight liên quan.','.two-col']],design:[['Story rhythm','Dùng image sequence và composition riêng cho từng project.','.media-frame'],['Evidence visualization','Bold metric kèm label; phân biệt hard result và qualitative proof.','.impact-grid'],['Role emphasis','Tách DSQUARE role thành một proof block dễ scan.','.role-panel']]},
        en:{keep:[['Structure','Challenge → Approach → Impact → DSQUARE role.','.story-grid'],['Direct answer','What DSQUARE solved, how, and with what outcome.','.story-grid'],['Evidence','Metrics include value, unit, timeframe and source.','.impact-grid'],['Context','Client, market, project, service and DSQUARE scope.','.case-hero'],['Relationship','Connect the case to its Service and related Insight.','.two-col']],design:[['Story rhythm','Use project-specific image sequence and composition.','.media-frame'],['Evidence visualization','Bold metrics with labels; separate hard and qualitative proof.','.impact-grid'],['Role emphasis','Make DSQUARE role a scannable proof block.','.role-panel']]}
      },
      insight:{
        vi:{keep:[['Structure','Question/H1 → direct answer → reasoning → example → author.','.article-body'],['Direct answer','Một đoạn 40–80 từ trả lời ngay vấn đề của bài.','.article-body .lead'],['Evidence','Case example, verified metric và link về nguồn/case gốc.','.media-frame'],['Context','Topic, service, author, published/updated date.','.author-card'],['Relationship','Insight link đến related Work và Services.','.aside-card']],design:[['Editorial hierarchy','Bold direct answer ngay sau H1; reasoning ở level tiếp theo.','.article-body'],['Evidence callout','Visualize project proof và metric trong article flow.','.media-frame'],['Authority treatment','Làm author, practice và dates rõ nhưng không lấn át content.','.author-card']]},
        en:{keep:[['Structure','Question/H1 → direct answer → reasoning → example → author.','.article-body'],['Direct answer','A 40–80 word answer immediately addresses the topic.','.article-body .lead'],['Evidence','Case example, verified metric and source link.','.media-frame'],['Context','Topic, service, author and publish/update dates.','.author-card'],['Relationship','Connect Insight to related Work and Services.','.aside-card']],design:[['Editorial hierarchy','Bold the direct answer directly after the H1.','.article-body'],['Evidence callout','Visualize project proof and metrics in the reading flow.','.media-frame'],['Authority treatment','Clarify author, practice and dates without overpowering content.','.author-card']]}
      }
    };
    const tabs=document.getElementById('tabs'), notes=document.getElementById('notes'), frame=document.getElementById('preview');
    let current=pages[0], lang='vi';

    function renderTabs(){
      tabs.innerHTML=pages.map(p=>`<button class="tab" type="button" data-page="${p.id}" aria-selected="${p.id===current.id}">${p.label}</button>`).join('');
      tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectPage(b.dataset.page)));
    }
    function renderNotes(){
      const c=ui[lang], f=focus[current.id][lang];
      const group=(kind,items)=>`<section class="focus-section ${kind}"><h2>${kind==='keep'?c.keep:c.design}</h2><p>${kind==='keep'?c.keepHint:c.designHint}</p><div class="focus-list">${items.map((x,i)=>`<button class="focus-item" type="button" data-group="${kind}" data-index="${i}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div></section>`;
      const secondary=current.notes.filter(n=>n.kind==='build'||n.kind==='decision');
      notes.innerHTML=group('keep',f.keep)+group('design',f.design)+`<details class="secondary"><summary>${c.secondary}</summary><div class="note-list">${secondary.map((n,i)=>{const v=vi[n.title];const title=lang==='vi'?v[0]:n.title;const body=lang==='vi'?v[1]:n.body;return `<button class="note" type="button" data-secondary="${i}" data-kind="${n.kind}"><h2>${title}</h2><p>${body}</p></button>`}).join('')}</div></details>`;
      notes.querySelectorAll('.focus-item').forEach(b=>b.addEventListener('click',()=>{const x=f[b.dataset.group][Number(b.dataset.index)];focusArea({kind:b.dataset.group,selector:x[2]})}));
      notes.querySelectorAll('[data-secondary]').forEach(b=>b.addEventListener('click',()=>focusArea(secondary[Number(b.dataset.secondary)])));
    }
    function selectPage(id){
      current=pages.find(p=>p.id===id); renderTabs(); renderNotes();
      document.getElementById('page-title').textContent=current.title;
      document.getElementById('url-label').textContent=current.url;
      frame.src=current.url;
    }
    function focusArea(note){
      const doc=frame.contentDocument; if(!doc) return;
      doc.querySelectorAll('[data-opportunity-focus]').forEach(el=>{el.style.outline='';el.style.outlineOffset='';el.removeAttribute('data-opportunity-focus');});
      let target=doc.querySelector(note.selector) || doc.querySelector('main'); if(!target) return;
      const colors={keep:'#2f7750',design:'#d56a24',build:'#2873c8',decision:'#7350a7'};
      target.setAttribute('data-opportunity-focus',''); target.style.outline=`5px solid ${colors[note.kind]}`; target.style.outlineOffset='-5px';
      target.scrollIntoView({behavior:'smooth',block:'center'});
    }
    function renderLanguage(){
      const c=ui[lang]; document.getElementById('top-instruction').textContent=c.instruction; document.getElementById('notes-title').textContent=c.title; document.getElementById('notes-intro').textContent=c.intro;
      document.querySelectorAll('[data-legend]').forEach(el=>el.textContent=c.legend[el.dataset.legend]);
      document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang))); renderNotes();
    }
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;renderLanguage()}));
    selectPage('home'); renderLanguage();
  </script>
</body>
</html>
